[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "exdrkg-rerun"
version = "0.1.0"
description = "Reviewer-rerun experiments for ExDR-KG (explainable drug repurposing)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "tabulate>=0.9", "matplotlib>=3.8"]

[project.optional-dependencies]
gpu = ["torch>=2.1", "torch_geometric>=2.4", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30"]
graph = ["python-igraph>=0.11", "numba>=0.58"]
llm = ["openai>=1.30"]
text = ["python-docx>=1.1", "pyspellchecker>=0.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["exdrkg_rerun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
